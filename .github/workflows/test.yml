name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # jq, flock and timeout ship with the runner; claude and at are faked
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: bash tests/run.sh
